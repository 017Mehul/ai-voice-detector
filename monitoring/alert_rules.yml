groups:
  - name: ai_voice_detector_alerts
    rules:
      - alert: HighErrorRate
        expr: rate(ai_voice_detector_errors_total[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }} errors per second"

      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(ai_voice_detector_request_duration_seconds_bucket[5m])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High response time detected"
          description: "95th percentile response time is {{ $value }} seconds"

      - alert: HighMemoryUsage
        expr: ai_voice_detector_memory_usage_bytes / 1024 / 1024 > 2000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is {{ $value }} MB"

      - alert: ServiceDown
        expr: up{job="ai-voice-detector"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "AI Voice Detector service is down"
          description: "The AI Voice Detector service has been down for more than 1 minute"

      - alert: LowCacheHitRate
        expr: (rate(ai_voice_detector_cache_hits_total[5m]) / (rate(ai_voice_detector_cache_hits_total[5m]) + rate(ai_voice_detector_cache_misses_total[5m]))) < 0.5
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "Low cache hit rate"
          description: "Cache hit rate is {{ $value | humanizePercentage }}"

      - alert: HighCPUUsage
        expr: ai_voice_detector_cpu_usage_percent > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is {{ $value }}%"