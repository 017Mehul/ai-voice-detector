name: Tests

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install system audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Build production Docker image
        run: docker build --tag ai-voice-detector:ci .
      - name: Smoke-test production container
        run: |
          docker run --detach --name ai-voice-detector-smoke --publish 8000:8000 ai-voice-detector:ci
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              docker rm --force ai-voice-detector-smoke
              exit 0
            fi
            sleep 2
          done
          docker logs ai-voice-detector-smoke
          docker rm --force ai-voice-detector-smoke
          exit 1
      - name: Run regression tests
        run: python -m pytest -q
